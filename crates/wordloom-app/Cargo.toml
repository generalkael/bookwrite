[package]
name = "wordloom"
description = "Wordloom — a writing studio for novelists, with a story timeline"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "wordloom"
path = "src/main.rs"

[dependencies]
wordloom-core = { path = "../wordloom-core" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
dirs = "6"

[build-dependencies]
cxx-qt-build = "0.10"
